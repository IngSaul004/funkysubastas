  buscar-uso: "&cUso: &f/subasta buscar <texto> &7(nombre del objeto en inglés, nombre personalizado o vendedor)"
  info: "&7Activas: &f{activas} &8| &7En buzones: &f{buzon} &8| &7Versión &f{version}"
