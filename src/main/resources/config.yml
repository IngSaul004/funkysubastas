  no-es-tuya: "&cEsa publicación no es tuya o ya no existe."
  cancelada: "&eCancelaste la publicación de &f{objeto}&e. La comisión no se devuelve."
  al-buzon: "&eNo te cupo &f{objeto}&e: quedó en tu buzón (&f/subasta buzon&e)."
  buzon-lleno-inventario: "&cHaz espacio en tu inventario para recoger esto."
  recogido: "&aRecogiste &f{objeto}&a."
  vencio: "&eTu publicación de &f{objeto} &evenció y quedó en tu buzón (&f/subasta buzon&e)."
