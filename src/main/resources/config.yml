  recargado: "&aConfig recargado."
  devolver-confirmar: "&cEsto regresa TODAS las publicaciones a los buzones. Escribe &f/subasta devolver-todo confirmar"
  devuelto-todo: "&aSe devolvieron &f{cantidad} &apublicaciones a los buzones."
