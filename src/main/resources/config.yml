# ==========================================================
#  FunkySubastas - configuración
#  Cambios: /subasta recargar  (no hace falta reiniciar)
#  Colores: solo códigos & (Bedrock no tiene hex).
# ==========================================================

# Publicaciones activas que puede tener cada jugador al mismo tiempo.
# Igual para todos: los rangos son solo cosméticos (regla de Mojang).
limite-publicaciones: 3

# Horas que dura una publicación. Al vencer, el objeto va al buzón del vendedor.
duracion-horas: 48

# Comisiones. Este dinero se DESTRUYE (sumidero de la economía, ver el presupuesto).
comision-publicar: 10        # se cobra al publicar y no se devuelve
porcentaje-venta: 5          # % del precio que se descuenta al vendedor cuando vende

# Límites de precio (evitan errores de dedo como 100000000).
precio-minimo: 1
precio-maximo: 1000000

# Mundos donde la subasta NO funciona. El lobby tiene inventario aparte:
# si se permite ahí, los objetos pasarían de un inventario al otro.
mundos-bloqueados:
  - lobby

# No dejar publicar en creativo ni espectador (evita vender objetos de creativo).
bloquear-creativo: true

# Objetos que no se pueden vender (nombres de Material de Paper).
objetos-prohibidos:
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - LIGHT
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - END_PORTAL_FRAME
  - REINFORCED_DEEPSLATE
  - BUDDING_AMETHYST

# Cada cuántos segundos se revisan las publicaciones vencidas.
revisar-vencidas-segundos: 60

# Zona horaria del registro (plugins/FunkySubastas/registro.log).
zona-horaria: America/Mexico_City

# ----------------------------------------------------------
#  Textos. {algo} se reemplaza solo. "prefijo" va antes de los mensajes del chat.
# ----------------------------------------------------------
mensajes:
  prefijo: "&d&lSUBASTA &8» &7"

  # Chat
  mundo-bloqueado: "&cLa subasta no funciona aquí. Ve al survival."
  creativo: "&cNo puedes publicar en creativo ni en espectador."
  mano-vacia: "&cToma en la mano el objeto que quieres vender."
  prohibido: "&cEse objeto no se puede vender en la subasta."
  precio-invalido: "&cPrecio inválido. Ejemplo: &f/subasta vender 250 &co &f/subasta vender 1.5k"
  precio-rango: "&cEl precio debe estar entre &f{min} &cy &f{max}&c."
  limite: "&cYa tienes &f{limite} &cpublicaciones activas. Cancela una con &f/subasta mias&c."
  sin-dinero-comision: "&cPublicar cuesta &f{comision}&c y no te alcanza."
  publicado: "&aPublicaste &f{objeto} &apor &6{precio}&a. Comisión cobrada: &f{comision}&a. Dura &f{horas}h&a. &8(#{id})"
  error: "&cAlgo salió mal y no se hizo ningún cambio. Avisa al staff."
  ya-vendida: "&cEsa publicación ya no está disponible."
  vencida: "&cEsa publicación ya venció."
  propia: "&cNo puedes comprar tu propia publicación. Cancélala en &f/subasta mias&c."
  sin-dinero: "&cTe faltan &f{falta} &cpara comprar esto."
  comprado: "&aCompraste &f{objeto} &apor &6{precio}&a."
